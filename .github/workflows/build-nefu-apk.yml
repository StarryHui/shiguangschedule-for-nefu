name: Build NEFU Android APK & iOS IPA

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build-android:
    name: 构建 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 运行贡献者数据生成脚本 (Generate Contributors Data)
        run: |
          chmod +x .github/scripts/build_contributors.sh
          .github/scripts/build_contributors.sh

      - name: 设置 JDK 21 (Setup JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle 缓存 (Cache Gradle Dependencies)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 构建 Debug APK (Build Debug APK)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: 上传 APK 产物 (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: shiguangschedule-nefu-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

  build-ios:
    name: 构建 iOS IPA
    runs-on: macos-14

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 安装 jq 工具 (Install jq)
        run: |
          which jq || brew install jq

      - name: 运行贡献者数据生成脚本 (Generate Contributors Data)
        run: |
          chmod +x .github/scripts/build_contributors.sh
          .github/scripts/build_contributors.sh

      - name: 设置 JDK 21 (Setup JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle 与 Konan 缓存 (Cache Gradle & Konan)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-ios-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ios-

      - name: 构建 iOS App (Build with Xcode)
        run: |
          chmod +x ./gradlew
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_STYLE=Manual

      - name: 打包未签名 IPA (Package Unsigned IPA)
        run: |
          mkdir -p Payload
          cp -r build/derivedData/Build/Products/Release-iphoneos/*.app Payload/
          zip -r -y shiguangschedule-nefu-v2.0.1-unsigned.ipa Payload

      - name: 上传 IPA 产物 (Upload IPA Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: shiguangschedule-nefu-ios-ipa
          path: "*.ipa"
          retention-days: 14
